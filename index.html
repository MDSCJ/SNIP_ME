        <div class="search-container">
            <h2>Find & Book Nearby Salons</h2>
            
            <form class="search-pill">

                    <select id="treatment" aria-label="Service type">

                <div class="input-group location-group">

                        <button type="button" id="locBtn" class="loc-btn" title="Use my current location" aria-label="Use my current location">

        <div class="salon-card skeleton-loader">

    <div id="locationModal" class="location-modal-overlay" aria-hidden="true">
        <div class="location-modal" role="dialog" aria-modal="true" aria-labelledby="locationModalTitle">
            <div class="location-modal-header">
                <h4 id="locationModalTitle">Select Location</h4>
                <button type="button" id="closeLocationModal" class="location-modal-close" aria-label="Close location picker">&times;</button>
            </div>
            <div id="locationMap" class="location-map" aria-label="Location map"></div>
            <div class="location-modal-actions">
                <button type="button" id="cancelLocationModal" class="btn-location-secondary">Close</button>
                <button type="button" id="confirmLocationBtn" class="btn-location-primary">OK</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        ScrollReveal().reveal('.salon-card', { delay: 100, distance: '40px', origin: 'bottom', interval: 100 });

        // location picker handler
        document.addEventListener('DOMContentLoaded', function() {
            var locBtn = document.getElementById('locBtn');
            var locInput = document.getElementById('location');
            var dateInput = document.getElementById('date');
            var dateBtn = document.getElementById('dateBtn');
            var locationModal = document.getElementById('locationModal');
            var closeLocationModal = document.getElementById('closeLocationModal');
            var cancelLocationModal = document.getElementById('cancelLocationModal');
            var confirmLocationBtn = document.getElementById('confirmLocationBtn');
            var mapInstance = null;
            var mapMarker = null;
            var selectedLatLng = null;
            var sriLankaBounds = L.latLngBounds(
                L.latLng(5.85, 79.45),
                L.latLng(10.05, 81.98)
            );
            var sriLankaCenter = L.latLng(7.8731, 80.7718);

            function isInsideSriLanka(lat, lng) {
                return sriLankaBounds.contains(L.latLng(lat, lng));
            }

            function normalizeToSriLanka(lat, lng) {
                if (isInsideSriLanka(lat, lng)) {
                    return { lat: lat, lng: lng };
                }
                return { lat: sriLankaCenter.lat, lng: sriLankaCenter.lng };
            }

            function setSelectedLocation(lat, lng, shouldCenterMap) {
                var safePoint = normalizeToSriLanka(lat, lng);
                selectedLatLng = { lat: safePoint.lat, lng: safePoint.lng };

                if (mapMarker) {
                    mapMarker.setLatLng([selectedLatLng.lat, selectedLatLng.lng]);
                } else {
                    mapMarker = L.marker([selectedLatLng.lat, selectedLatLng.lng], { draggable: true }).addTo(mapInstance);
                    mapMarker.on('dragend', function() {
                        var markerPos = mapMarker.getLatLng();
                        setSelectedLocation(markerPos.lat, markerPos.lng, false);
                    });
                }

                if (shouldCenterMap) {
                    mapInstance.setView([selectedLatLng.lat, selectedLatLng.lng], 14);
                }
            }

            function ensureMap() {
                if (mapInstance) {
                    return;
                }

                mapInstance = L.map('locationMap', {
                    zoomControl: true,
                    maxBounds: sriLankaBounds,
                    maxBoundsViscosity: 1.0,
                    minZoom: 8
                });

                mapInstance.fitBounds(sriLankaBounds);

                L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                    maxZoom: 19,
                    attribution: 'Tiles &copy; Esri'
                }).addTo(mapInstance);

                mapInstance.on('click', function(e) {
                    setSelectedLocation(e.latlng.lat, e.latlng.lng, false);
                });
            }

            function openLocationModal() {
                if (!locationModal) {
                    return;
                }

                ensureMap();
                locationModal.classList.add('open');
                locationModal.setAttribute('aria-hidden', 'false');
                document.body.classList.add('modal-open');

                setTimeout(function() {
                    if (mapInstance) {
                        mapInstance.invalidateSize();
                        if (!selectedLatLng) {
                            mapInstance.fitBounds(sriLankaBounds);
                        }
                    }
                }, 100);

                if (navigator.geolocation) {
                    locBtn.classList.add('loading');
                    navigator.geolocation.getCurrentPosition(function(pos) {
                        setSelectedLocation(pos.coords.latitude, pos.coords.longitude, true);
                        locBtn.classList.remove('loading');
                    }, function() {
                        if (!selectedLatLng) {
                            setSelectedLocation(sriLankaCenter.lat, sriLankaCenter.lng, true);
                        }
                        locBtn.classList.remove('loading');
                    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
                } else if (!selectedLatLng) {
                    setSelectedLocation(sriLankaCenter.lat, sriLankaCenter.lng, true);
                }
            }

            function closeModal() {
                if (!locationModal) {
                    return;
                }
                locationModal.classList.remove('open');
                locationModal.setAttribute('aria-hidden', 'true');
                document.body.classList.remove('modal-open');
                locBtn.classList.remove('loading');
            }

            function setMinimumBookingDate() {
                if (!dateInput) {
                    return;
                }

                // Prevent today from being selected
                var today = new Date();
                today.setHours(0, 0, 0, 0);
                var tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                var minDate = tomorrow.getFullYear() + '-' +
                    String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' +
                    String(tomorrow.getDate()).padStart(2, '0');
                dateInput.min = minDate;

                if (dateInput.value && dateInput.value < minDate) {
                    dateInput.value = '';
                }
            }

            setMinimumBookingDate();

            if (dateBtn && dateInput) {
                dateBtn.addEventListener('click', function() {
                    if (typeof dateInput.showPicker === 'function') {
                        dateInput.showPicker();
                    } else {
                        dateInput.focus();
                        dateInput.click();
                    }
                });
            }

            if (locBtn && locInput && locationModal) {
                locBtn.addEventListener('click', function() {
                    openLocationModal();
                });

                confirmLocationBtn.addEventListener('click', function() {
                    if (selectedLatLng) {
                        locInput.value = selectedLatLng.lat.toFixed(5) + ', ' + selectedLatLng.lng.toFixed(5);
                    }
                    closeModal();
                });

                closeLocationModal.addEventListener('click', closeModal);
                cancelLocationModal.addEventListener('click', closeModal);

                locationModal.addEventListener('click', function(event) {
                    if (event.target === locationModal) {
                        closeModal();
                    }
                });

                document.addEventListener('keydown', function(event) {
                    if (event.key === 'Escape' && locationModal.classList.contains('open')) {
                        closeModal();
                    }
                });
            } else if (locBtn && locInput) {
                locBtn.addEventListener('click', function() {
                    locInput.value = 'Location picker unavailable';
                });
            }
        });
    </script>
