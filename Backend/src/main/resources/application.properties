spring.application.name=snipme
spring.config.import=optional:application-secrets.properties



# MySQL Database Credentials
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}


spring.datasource.url=jdbc:mysql://snip-me-blahblahblah.f.aivencloud.com:13934/defaultdb?sslMode=REQUIRED

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# JWT_SECRET is required: generate with `openssl rand -base64 48` and set it on Render.
# Rotating it immediately invalidates every previously issued (or forged) token.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:28800000}

# Admin login (set on Render; never commit real values)
app.admin.email=${ADMIN_EMAIL:m.d.s.chamath@gmail.com}
app.admin.password=${ADMIN_PASSWORD:}

# Browsers allowed to call this API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://mdscj.github.io,http://localhost:*,http://127.0.0.1:*,null}

# Never leak stack traces / exception messages to clients
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=admin.snipme@gmail.com

# PayHere Credentials
# ─────────────────────────────────────────────────────────────────────────────
# On Render, set these environment variables:
#   PAYHERE_MERCHANT_ID      → your PayHere merchant ID (sandbox or live)
#   PAYHERE_MERCHANT_SECRET  → the merchant secret matching that account
#   PAYHERE_SANDBOX_MODE     → "true"  to test using PayHere sandbox (default)
#                              "false" to process real live payments
#
# While PAYHERE_SANDBOX_MODE=true the backend uses the sandbox secret and
# tells the frontend to open the sandbox popup — regardless of which domain
# (localhost OR github.io) is making the call.
#
# Locally: override in application-secrets.properties (gitignored)
payhere.merchant.id=${PAYHERE_MERCHANT_ID}
payhere.merchant.secret=${PAYHERE_MERCHANT_SECRET}
payhere.sandbox.mode=${PAYHERE_SANDBOX_MODE:true}
