spring.application.name=snipme
spring.config.import=optional:application-secrets.properties

# Use configured SMTP username as default sender address for password reset emails
app.mail.from=${spring.mail.username:no-reply@snipme.local}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/snipme_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
app.jwt.expiration=86400000
