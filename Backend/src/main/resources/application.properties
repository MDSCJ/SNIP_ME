spring.application.name=snipme
spring.config.import=optional:application-secrets.properties



# MySQL Database Credentials
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD:change-me}


spring.datasource.url=jdbc:mysql://snip-me-blahblahblah.f.aivencloud.com:13934/defaultdb?sslMode=REQUIRED

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
app.jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=admin.snipme@gmail.com

# PayHere Sandbox Credentials
# On Render: set PAYHERE_MERCHANT_ID, PAYHERE_SECRET_LOCALHOST, PAYHERE_SECRET_PRODUCTION as env vars
# Locally: these are overridden by application-secrets.properties (gitignored)
payhere.merchant.id=${PAYHERE_MERCHANT_ID:1235274}
payhere.secret.localhost=${PAYHERE_SECRET_LOCALHOST:change-me}
payhere.secret.production=${PAYHERE_SECRET_PRODUCTION:change-me}