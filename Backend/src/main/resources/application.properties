spring.application.name=snipme

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Enable the H2 Console (so you can see your tables)
spring.h2.console.enabled=true

# This line is critical: it allows H2 to show up inside a frame (Spring Security blocks this by default)
spring.main.allow-bean-definition-overriding=true

# --- JWT SETTINGS ---
# Keep your secret and expiration here instead of hardcoding them in Java
app.jwt.secret=your_ultra_secure_secret_key_for_snipme_2026_gatekeeper
app.jwt.expiration=86400000