spring.application.name=snipme
spring.config.import=optional:classpath:application-local.properties

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Enable the H2 Console (so you can see your tables)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# This line is critical: it allows H2 to show up inside a frame (Spring Security blocks this by default)
spring.main.allow-bean-definition-overriding=true

# --- JWT SETTINGS ---
# Keep your secret and expiration here instead of hardcoding them in Java
app.jwt.secret=your_ultra_secure_secret_key_for_snipme_2026_gatekeeper
app.jwt.expiration=86400000

# --- GMAIL SMTP ---
# Use an App Password (not your normal Gmail password).
# Enable 2-Step Verification on your Google account, then generate an App Password at:
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.debug=true
