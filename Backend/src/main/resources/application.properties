spring.application.name=snipme
spring.config.import=optional:application-secrets.properties

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/snipme_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=#Iadeesha.24

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLong!
app.jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
