spring.application.name=snipme
spring.config.import=optional:classpath:application-local.properties

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/snipme_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT: Sensitive credentials are stored in application-secrets.properties
# This file is gitignored to prevent committing secrets to the repository
spring.config.import=optional:file:./application-secrets.properties

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.expiration=86400000

# --- GMAIL SMTP ---
# Use an App Password (not your normal Gmail password).
# Enable 2-Step Verification on your Google account, then generate an App Password at:
# https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
app.mail.from=${MAIL_FROM:}
spring.mail.properties.mail.debug=true
