spring.application.name=snipme

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/snipme_db?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# IMPORTANT: Sensitive credentials are stored in application-secrets.properties
# This file is gitignored to prevent committing secrets to the repository
spring.config.import=optional:file:./application-secrets.properties

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.expiration=86400000
