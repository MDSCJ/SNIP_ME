<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Salon Owner Login | SNIP ME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/salon-owner-login.css">
    <link rel="stylesheet" href="css/loader.css">

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="dark-theme">
    <header class="main-header">
        <div class="header-content">
            <div class="logo-left">
                <img src="images/desktop.jpg" alt="SNIP ME Logo">
            </div>
        </div>
    </header>

    <nav class="nav-bar">
        <div class="nav-toggle">&#9776;</div>
        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>

    <!-- Background Video -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="videos/bc.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Loading Overlay with Scissor Animation -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="glass-card">
            <svg class="scissor-loader" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <g fill="none" stroke="rgba(255, 255, 255, 0.85)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M 28 15 C 28 5 12 5 12 15 C 12 25 25 24 40 25" class="wave-line delay-1" />
                    <path d="M 28 35 C 28 45 12 45 12 35 C 12 25 25 26 40 25" class="wave-line delay-1" />
                    <circle cx="20" cy="15" r="4.5" class="wave-line delay-2" />
                    <circle cx="20" cy="35" r="4.5" class="wave-line delay-2" />
                    <path d="M 40 25 L 85 31 L 45 25" class="wave-line delay-3" />
                    <path d="M 40 25 L 85 19 L 45 25" class="wave-line delay-3" />
                    <circle cx="43" cy="25" r="1.5" class="wave-line delay-4" />
                </g>
            </svg>
            <div class="loader-text">
                <span>.</span><span>.</span><span>.</span>
            </div>
        </div>
    </div>

    <!-- Main Section -->
    <main class="owner-login-section">
        <div class="login-wrapper">
            <div class="login-box">

                <!-- LOGIN VIEW -->
                <div id="ownerLoginView">
                    <h1>Welcome Back</h1>
                    <p class="subtitle">Sign in to manage your salon</p>

                    <!-- REAL GOOGLE BUTTON WILL RENDER HERE -->
                    <div id="ownerGoogleButton" style="display:flex; justify-content:center; margin-bottom:28px;"></div>

                    <div class="separator">
                        <span>OR</span>
                    </div>

                    <form id="ownerLoginForm">
                        <label for="ownerLoginEmail">Business email address</label>
                        <input type="email" id="ownerLoginEmail" placeholder="Enter your business email" required>

                        <label for="ownerLoginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="ownerLoginPassword" placeholder="Enter your password" required>

                            <button type="button" class="toggle-password" id="toggleOwnerLoginPassword" aria-label="Show password">
                                <svg id="ownerLoginEyeOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>

                                <svg id="ownerLoginEyeClosed" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"></path>
                                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.53"></path>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                    <path d="M1 1l22 22"></path>
                                </svg>
                            </button>
                        </div>

                        <button type="submit" class="signin-btn">Sign In</button>
                    </form>

                    <div class="signup-link">
                        Don't have a salon account? <a href="#" id="showOwnerSignup">Sign up now</a>
                    </div>
                </div>

                <!-- SIGNUP VIEW -->
                <div id="ownerSignupView" class="hidden-view">
                    <h1>Create Account</h1>
                    <p class="subtitle">Sign up to manage your salon</p>

                    <form id="ownerSignupForm">
                        <label for="salonName">Salon name</label>
                        <input type="text" id="salonName" placeholder="Enter your salon name" required>

                        <label for="salonDetails">Salon details</label>
                        <input type="text" id="salonDetails" placeholder="Enter salon details or address" required>

                        <label for="ownerName">Owner name</label>
                        <input type="text" id="ownerName" placeholder="Enter owner name" required>

                        <label for="ownerSignupEmail">Business email address</label>
                        <input type="email" id="ownerSignupEmail" placeholder="Enter your business email" required>

                        <label for="ownerPhone">Phone number</label>
                        <input type="tel" id="ownerPhone" placeholder="Enter your phone number" required>

                        <label for="ownerSignupPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="ownerSignupPassword" placeholder="Create a password" required>

                            <button type="button" class="toggle-password" id="toggleOwnerSignupPassword" aria-label="Show password">
                                <svg id="ownerSignupEyeOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>

                                <svg id="ownerSignupEyeClosed" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"></path>
                                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.53"></path>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                    <path d="M1 1l22 22"></path>
                                </svg>
                            </button>
                        </div>

                        <label for="ownerConfirmPassword">Confirm password</label>
                        <div class="password-wrapper">
                            <input type="password" id="ownerConfirmPassword" placeholder="Re-enter your password" required>

                            <button type="button" class="toggle-password" id="toggleOwnerConfirmPassword" aria-label="Show password">
                                <svg id="ownerConfirmEyeOpen" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12S5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>

                                <svg id="ownerConfirmEyeClosed" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"></path>
                                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.53"></path>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                    <path d="M1 1l22 22"></path>
                                </svg>
                            </button>
                        </div>

                        <button type="submit" class="signin-btn">Sign Up</button>
                    </form>

                    <div class="signup-link">
                        Already have a salon account? <a href="#" id="showOwnerLogin">Sign in</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 <a href="../index.html">SNIP ME</a>. All rights reserved.</p>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/salon-owner-login.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        var toggle = document.querySelector('.nav-toggle');
        var navList = document.querySelector('.nav-bar ul');

        if (toggle && navList) {
            toggle.addEventListener('click', function () {
                navList.classList.toggle('open');
            });
        }

        var navLinks = document.querySelectorAll('.nav-bar ul li a');
        navLinks.forEach(function(link) {
            link.addEventListener('click', function() {
                navList.classList.remove('open');
            });
        });
    });
    </script>

    <script src="js/main.js"></script>
</body>
</html>
