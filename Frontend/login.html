<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/scrollreveal"></script>
    <title>Login | SNIP ME</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/heading-shadows.css">
</head>

<body class="dark-theme">
    <header class="main-header">
        <div class="header-content">
            <div class="logo-left">
                <img src="images/desktop.jpg" alt="SNIP ME Logo">
            </div>
            
        </div>
    </header>

    <nav class="nav-bar">
        <button class="nav-toggle" aria-label="open menu">☰</button>
        <ul>
            <li><a href="../index.html" >Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="settings.html">Settings</a></li>
        </ul>
    </nav>

    <!-- Background Video -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="videos/bc.mp4" type="video/mp4">
    </video>

    <!-- Center Content -->
    <div class="center-container">
        <div class="role-group" id="customerRoleGroup">
            <button class="btn-outline role-main-btn" type="button">Log in as Customer</button>
            <div class="role-options">
                <button class="btn-outline role-option-btn" type="button" data-target="customer_login.html?mode=signin">Sign In</button>
                <button class="btn-outline role-option-btn" type="button" data-target="customer_login.html?mode=signup">Sign Up</button>
            </div>
        </div>

        <div class="role-group" id="ownerRoleGroup">
            <button class="btn-outline role-main-btn" type="button">Log in as Salon Owner</button>
            <div class="role-options">
                <button class="btn-outline role-option-btn" type="button" data-target="salon-owner-login.html?mode=signin">Sign In</button>
                <button class="btn-outline role-option-btn" type="button" data-target="salon-owner-login.html?mode=signup">Sign Up</button>
            </div>
        </div>

        <button class="btn-outline"
            onclick="window.location.href='admin-login.html'">
            Log in as Admin
        </button>

        <button id="goToOwnerDashboardBtn" class="btn-outline" style="display: none;"
            onclick="window.location.href='Salon-Owner-Dashboard.html'">
            Go to My Dashboard
        </button>

        <button id="goToAdminDashboardBtn" class="btn-outline" style="display: none;"
            onclick="window.location.href='admin-dashboard.html'">
            Go to Admin Dashboard
        </button>

    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
    var goToOwnerDashboardBtn = document.getElementById('goToOwnerDashboardBtn');
    var goToAdminDashboardBtn = document.getElementById('goToAdminDashboardBtn');
    var roleGroups = document.querySelectorAll('.role-group');

    function isValidJwt(token) {
        if (!token || token.split('.').length !== 3) {
            return false;
        }

        try {
            var payloadPart = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            var payload = JSON.parse(atob(payloadPart));
            if (!payload.exp) {
                return false;
            }
            return (payload.exp * 1000) > Date.now();
        } catch (e) {
            return false;
        }
    }

    var ownerLoggedIn = localStorage.getItem('snipmeOwnerLoggedIn') === 'true';
    var ownerToken = localStorage.getItem('snipmeOwnerToken');
    var ownerEmail = localStorage.getItem('snipmeOwnerEmail');
    var adminLoggedIn = localStorage.getItem('snipmeAdminLoggedIn') === 'true';

    var ownerSessionValid = ownerLoggedIn && ownerToken && ownerEmail && isValidJwt(ownerToken);
    if (!ownerSessionValid) {
        localStorage.removeItem('snipmeOwnerLoggedIn');
        localStorage.removeItem('snipmeOwnerToken');
        localStorage.removeItem('snipmeOwnerEmail');
        localStorage.removeItem('snipmeOwnerName');
        localStorage.removeItem('snipmeOwnerSalonName');
        localStorage.removeItem('snipmeOwnerUserId');
        localStorage.removeItem('snipmeOwnerPhone');
    }

    var adminToken = localStorage.getItem('snipmeAdminToken');
    var adminSessionValid = adminLoggedIn && adminToken && isValidJwt(adminToken);
    if (!adminSessionValid) {
        localStorage.removeItem('snipmeAdminLoggedIn');
        localStorage.removeItem('snipmeAdminToken');
        localStorage.removeItem('snipmeAdminEmail');
        localStorage.removeItem('snipmeAdminName');
    }

    if (goToOwnerDashboardBtn && ownerSessionValid) {
        goToOwnerDashboardBtn.style.display = 'block';
    }
    if (goToAdminDashboardBtn && adminSessionValid) {
        goToAdminDashboardBtn.style.display = 'block';
    }

    roleGroups.forEach(function (group) {
        var mainBtn = group.querySelector('.role-main-btn');
        var optionBtns = group.querySelectorAll('.role-option-btn');

        if (mainBtn) {
            mainBtn.addEventListener('click', function () {
                var alreadyActive = group.classList.contains('active');
                roleGroups.forEach(function (g) { g.classList.remove('active'); });
                if (!alreadyActive) {
                    group.classList.add('active');
                }
            });
        }

        optionBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                var target = btn.getAttribute('data-target');
                if (target) {
                    window.location.href = target;
                }
            });
        });
    });

});
</script>
    <footer>
        <p>&copy; 2026 <a href="../index.html">SNIP ME</a>. All rights reserved. by <span class="footer-starc">STARC</span>.</p>
    </footer>

    <script src="js/api-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth_session.js"></script>
    <script src="js/customer_session.js"></script>
    <script src="js/devtools-warning.js"></script>
</body>
</html>
